plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Native Firebase resources are needed for delivery when the app is closed.
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

// Keep the original signing identity when updating an installed app. Never
// silently fall back to a different key when the owner supplies key.properties.
def ownerSigningFile = rootProject.file("key.properties")
def ownerSigning = new Properties()
if (ownerSigningFile.exists()) {
    ownerSigningFile.withInputStream { ownerSigning.load(it) }
    ["storeFile", "storePassword", "keyAlias", "keyPassword"].each { name ->
        if (!ownerSigning.getProperty(name)?.trim()) {
            throw new GradleException("Missing ${name} in android/key.properties")
        }
    }
    if (!rootProject.file(ownerSigning.getProperty("storeFile")).isFile()) {
        throw new GradleException("The keystore in android/key.properties does not exist. Restore the original signing key.")
    }
}

android {
    namespace = "com.aikyam.whatsappautomation"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.aikyam.whatsappautomation"
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (ownerSigningFile.exists()) {
            release {
                storeFile = rootProject.file(ownerSigning.getProperty("storeFile"))
                storePassword = ownerSigning.getProperty("storePassword")
                keyAlias = ownerSigning.getProperty("keyAlias")
                keyPassword = ownerSigning.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            // Preserve existing sideloaded builds on this PC. For a production
            // key, provide key.properties pointing to the ORIGINAL keystore.
            signingConfig = ownerSigningFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
