# GreetSync Android build configuration
# Java/Gradle memory
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -Dfile.encoding=UTF-8

android.useAndroidX=true
android.enableJetifier=true

# Flutter 3.44+ compatibility while this app remains on AGP 8.x/KGP.
# These are the documented transitional flags; built-in Kotlin requires AGP 9+.
android.builtInKotlin=false
android.newDsl=false

# Windows/Kotlin cache hardening.
# The previous build failed because multiple Kotlin plugin compilations attempted
# to reuse already-registered incremental cache files. Compile in-process and
# disable Kotlin/Gradle build caches for deterministic local and release builds.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
kotlin.daemon.enabled=false
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=false
org.gradle.configuration-cache=false
org.gradle.vfs.watch=false
