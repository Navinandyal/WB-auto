name: greetsync_mobile
description: GreetSync mobile client for WhatsApp Business greetings, messaging and automation.
publish_to: none
version: 1.0.3+4
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.1
  connectivity_plus: ^6.1.1
  flutter_contacts: ^2.5.0
  country_picker: ^2.0.27
  file_picker: ^8.1.7
  csv: ^6.0.0
  excel: ^4.0.6
  archive: ^3.6.1
  xml: ^6.6.1
  url_launcher: ^6.3.2
  video_player: ^2.9.3
  path_provider: ^2.1.5
  open_filex: ^4.6.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/greetsync_logo.png
    - assets/samples/
