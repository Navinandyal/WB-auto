name: whatsapp_automation_mobile
description: Flutter mobile client for the existing WhatsApp Automation backend.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.1
  connectivity_plus: ^6.1.1
  flutter_contacts: ^1.1.9+2
  country_picker: ^2.0.27
  file_picker: ^8.1.7
  csv: ^6.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
