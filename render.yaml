services:
  - type: web
    name: greetsync-backend
    runtime: docker
    plan: free
    numInstances: 1
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PROVIDER
        value: supabase
      - key: DATABASE_URL
        sync: false
      - key: AUTH_TOKEN_SECRET
        sync: false
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
